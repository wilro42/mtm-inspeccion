<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MTM">
<meta name="theme-color" content="#f59e0b">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>MTM Inspección</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0f14;--surface:#141820;--card:#1a1f2e;--border:#252c3f;
  --accent:#f59e0b;--red:#ef4444;--green:#22c55e;--blue:#3b82f6;
  --purple:#a855f7;--teal:#14b8a6;--orange:#f97316;
  --text:#e2e8f0;--muted:#8892a4;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}

/* HEADER */
#header{background:var(--surface);border-bottom:2px solid var(--accent);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo-txt{font-weight:900;font-size:20px;letter-spacing:3px;color:var(--accent)}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:2px}
.hdr-right{font-size:10px;color:var(--muted);text-align:right;font-family:monospace}
.vencido-badge{background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;font-weight:700;margin-left:6px}

/* NAV */
#nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch}
#nav::-webkit-scrollbar{display:none}
.tab{padding:11px 14px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:1px;cursor:pointer;white-space:nowrap;transition:color .2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* SCROLL AREA */
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;padding-bottom:max(20px,env(safe-area-inset-bottom))}
.section{display:none}.section.active{display:block}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px}
.sect-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:6px}

/* FORM */
label{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;display:block}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:14px;padding:8px 10px;outline:none;font-family:inherit;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:68px}
.fgroup{margin-bottom:10px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:0}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* YESNO */
.yn{display:flex;gap:6px}
.yn button{flex:1;padding:7px 0;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--muted);font-weight:700;font-size:12px;cursor:pointer;transition:all .15s}
.yn button.sel-yn{border-color:var(--accent);background:var(--accent);color:#000}

/* MULTICHECK */
.mc{display:flex;flex-wrap:wrap;gap:6px}
.mc button{padding:5px 10px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.mc button.sel-mc{border-color:var(--teal);background:rgba(20,184,166,.15);color:var(--teal)}
.mc.orange button.sel-mc{border-color:var(--orange);background:rgba(249,115,22,.15);color:var(--orange)}
.mc.blue button.sel-mc{border-color:var(--blue);background:rgba(59,130,246,.15);color:var(--blue)}
.mc.purple button.sel-mc{border-color:var(--purple);background:rgba(168,85,247,.15);color:var(--purple)}

/* STATUS BTNS */
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.status-btn{padding:9px 6px;border-radius:4px;font-weight:700;font-size:12px;cursor:pointer;transition:all .15s}

/* BADGES */
.badge{display:inline-block;border-radius:3px;padding:2px 7px;font-size:10px;font-weight:700;letter-spacing:.5px;border:1px solid currentColor}

/* BTN */
.btn-main{width:100%;padding:13px;background:var(--accent);color:#000;border:none;border-radius:4px;font-weight:900;font-size:13px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-bottom:20px}
.btn-add{width:100%;padding:8px;background:transparent;border:1px dashed var(--teal);color:var(--teal);border-radius:4px;font-size:12px;font-weight:700;cursor:pointer;margin-bottom:12px}
.btn-del-sm{background:none;border:1px solid var(--red);color:var(--red);border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer;font-weight:700}
.btn-back{background:none;border:1px solid var(--border);color:var(--accent);border-radius:4px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;margin-bottom:14px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:8px;padding:14px 10px;text-align:center}
.kpi-num{font-weight:900;font-size:36px;line-height:1}
.kpi-lbl{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:3px}

/* ALERT BOX */
.alert-box{background:var(--card);border:1px solid var(--red);border-radius:8px;padding:14px;margin-bottom:14px}
.alert-title{font-size:11px;color:var(--red);letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:8px}
.alert-item{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px;align-items:flex-start}
.alert-item:last-child{border-bottom:none}
.dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}

/* TYPE GRID */
.type-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.type-box{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center}
.type-num{font-weight:900;font-size:28px;color:var(--accent)}
.type-lbl{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px}

/* RECORDS */
.rec-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;cursor:pointer}
.rec-id{font-size:14px;font-weight:700}
.rec-meta{font-size:11px;color:var(--muted);margin-top:4px}
.rec-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rec-tag{font-size:10px}
.rec-obs{font-size:12px;color:#94a3b8;margin-top:4px;font-style:italic}
.rec-hint{font-size:10px;color:var(--muted);margin-top:4px;text-align:right}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;line-height:2}

/* CAPA BOX */
.capa-box{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px}
.capa-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.capa-name{flex:1;margin-right:8px}

/* PHOTOS */
.photo-upload{background:var(--bg);border:1px dashed var(--purple);border-radius:6px;padding:12px;margin-bottom:12px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photo-thumb{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:1}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-rech{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:3px;padding:1px 5px}
.photo-del{position:absolute;bottom:2px;right:2px;background:rgba(0,0,0,.7);border:none;color:#fff;border-radius:3px;font-size:12px;cursor:pointer;padding:1px 6px}
.photo-desc{position:absolute;bottom:0;left:0;right:20px;background:rgba(0,0,0,.65);color:#fff;font-size:9px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo-stage-title{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.stage-count{background:var(--accent);color:#000;border-radius:10px;padding:0 7px;font-size:10px}

/* PREVIEW OVERLAY */
#photoOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#photoOverlay.show{display:flex}
#photoOverlay img{max-width:100%;max-height:70vh;object-fit:contain;border-radius:8px}
#photoOverlay .ov-info{color:var(--text);margin-top:10px;font-size:13px;text-align:center}
#photoOverlay .ov-hint{color:var(--muted);font-size:12px;margin-top:10px}

/* DETAIL VIEW */
#detail{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;overflow-y:auto;padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
#detail.show{display:block}
.detail-header{background:var(--card);border-radius:8px;padding:14px;margin-bottom:14px}
.detail-title{font-weight:900;font-size:20px;color:var(--accent)}
.detail-sub{font-size:12px;color:var(--muted);margin-top:3px}
.detail-sect{margin-bottom:14px}
.detail-sect-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:6px;border-bottom:1px solid var(--border);padding-bottom:4px}
.detail-row{display:flex;gap:6px;margin-bottom:4px;font-size:13px}
.detail-lbl{color:var(--muted);min-width:130px;flex-shrink:0}
.detail-val{color:var(--text)}
.btn-del-rec{width:100%;padding:10px;background:transparent;border:1px solid var(--red);color:var(--red);border-radius:4px;font-weight:700;font-size:12px;cursor:pointer}

/* SAVED MSG */
.saved-msg{background:#052e16;border:1px solid var(--green);color:var(--green);border-radius:6px;padding:9px 14px;font-size:13px;text-align:center;margin-bottom:12px;display:none}
.saved-msg.show{display:block}

/* FILTER ROW */
.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.search-row{margin-bottom:10px}
.rec-count-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.count-badge{background:var(--accent);color:#000;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}

/* VENCIDO tag */
.venc{color:var(--red)}
.ok-date{color:var(--accent)}

@media(prefers-color-scheme:light){
  :root{--bg:#f0f2f5;--surface:#fff;--card:#fff;--border:#d1d5db;--text:#111827;--muted:#6b7280}
  input,select,textarea{background:#f9fafb;color:#111827}
  .capa-box,.type-box{background:#f3f4f6}
}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div><div class="logo-txt">MTM</div><div class="logo-sub">SISTEMA DE INSPECCIÓN</div></div>
    <div class="hdr-right"><span id="clockTxt"></span><span id="vencBadge" class="vencido-badge" style="display:none"></span></div>
  </div>
  <div id="nav">
    <button class="tab active" onclick="showTab('dash')">📊 Dashboard</button>
    <button class="tab" onclick="showTab('form')">➕ Registrar</button>
    <button class="tab" onclick="showTab('records')">📋 Registros</button>
  </div>
  <div id="content">

    <!-- DASHBOARD -->
    <div class="section active" id="sec-dash">
      <div class="kpi-grid">
        <div class="kpi" style="border:1px solid var(--green)"><div class="kpi-num" style="color:var(--green)" id="kpi-ok">0</div><div class="kpi-lbl">OK / Liberados</div></div>
        <div class="kpi" style="border:1px solid var(--accent)"><div class="kpi-num" style="color:var(--accent)" id="kpi-ep">0</div><div class="kpi-lbl">En Proceso</div></div>
        <div class="kpi" style="border:1px solid var(--red)"><div class="kpi-num" style="color:var(--red)" id="kpi-re">0</div><div class="kpi-lbl">Rechazados</div></div>
        <div class="kpi" style="border:1px solid var(--blue)"><div class="kpi-num" style="color:var(--blue)" id="kpi-pe">0</div><div class="kpi-lbl">Pendientes</div></div>
      </div>
      <div id="dash-venc" class="alert-box" style="display:none">
        <div class="alert-title">🔴 Fechas Vencidas</div>
        <div id="dash-venc-list"></div>
      </div>
      <div class="card">
        <div class="sect-title" style="color:var(--accent)">⚠ Alertas Activas</div>
        <div id="dash-alerts"><div class="empty-state">✅ Sin alertas</div></div>
      </div>
      <div class="card">
        <div class="sect-title" style="color:var(--accent)">Por Tipo</div>
        <div class="type-grid">
          <div class="type-box"><div class="type-num" id="t-tank">0</div><div class="type-lbl">Tanques</div></div>
          <div class="type-box"><div class="type-num" id="t-prensa">0</div><div class="type-lbl">Prensas</div></div>
          <div class="type-box"><div class="type-num" id="t-rad">0</div><div class="type-lbl">Radiadores</div></div>
        </div>
      </div>
    </div>

    <!-- FORM -->
    <div class="section" id="sec-form">
      <div class="saved-msg" id="savedMsg">✅ Inspección guardada correctamente</div>
      <div id="form-content"></div>
      <button class="btn-main" onclick="saveRecord()">GUARDAR INSPECCIÓN</button>
    </div>

    <!-- RECORDS -->
    <div class="section" id="sec-records">
      <div class="search-row"><input type="search" id="searchInput" placeholder="🔍 Buscar ID, proyecto, inspector..." oninput="renderRecords()"></div>
      <div class="filter-row">
        <select id="fTipo" onchange="renderRecords()"><option value="">Todos los tipos</option><option>Tanque</option><option>Prensa</option><option>Radiador</option></select>
        <select id="fEstado" onchange="renderRecords()"><option value="">Todos los estados</option><option value="OK">OK</option><option value="EN_PROCESO">En Proceso</option><option value="RECHAZADO">Rechazado</option><option value="PENDIENTE">Pendiente</option></select>
      </div>
      <div class="rec-count-row"><div style="font-weight:700;font-size:14px">Registros</div><span class="count-badge" id="recCount">0</span></div>
      <div id="recList"></div>
    </div>

  </div>
</div>

<!-- DETAIL PANEL -->
<div id="detail">
  <button class="btn-back" onclick="closeDetail()">← Volver</button>
  <div id="detail-body"></div>
</div>

<!-- PHOTO OVERLAY -->
<div id="photoOverlay" onclick="closePhotoOverlay()">
  <img id="ovImg" src="" alt="">
  <div class="ov-info" id="ovInfo"></div>
  <div class="ov-hint">Toca para cerrar</div>
</div>

// CLOCK
// ══════════════════════════════════════════════
function updateClock(){
  const now = new Date();
  document.getElementById("clockTxt").textContent =

setInterval(updateClock,60000); updateClock();

// TABS

function showTab(id){
  currentTab = id;
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.getElementById("sec-"+id).classList.add("active");
  event.target.classList.add("active");
  document.getElementById("content").scrollTop = 0;
  if(id==="dash") renderDash();
  if(id==="form"){ buildForm(); document.getElementById("savedMsg").classList.remove("show"); }
  if(id==="records") renderRecords();
}

// ══════════════════════════════════════════════
// HELPERS: HTML builders
// ══════════════════════════════════════════════
function fg(label, html){ return `<div class="fgroup"><label>${label}</label>${html}</div>`; }
function r2(...items){ return `<div class="r2 fgroup">${items.map(i=>`<div>${i}</div>`).join("")}</div>`; }
function r3(...items){ return `<div class="r3 fgroup">${items.map(i=>`<div>${i}</div>`).join("")}</div>`; }
function inp(id,placeholder="",type="text",val=""){
  return `<input id="${id}" type="${type}" value="${esc(val)}" placeholder="${placeholder}" oninput="form['${id}']=this.value">`;
}
function sel(id, options, val="", placeholder="-- Seleccionar --"){
  return `<select id="${id}" onchange="form['${id}']=this.value"><option value="">${placeholder}</option>${options.map(o=>`<option value="${o}"${val===o?" selected":""}>${o}</option>`).join("")}</select>`;
}
function txt(id,placeholder="",val="",rows=2){
  return `<textarea id="${id}" placeholder="${placeholder}" rows="${rows}" oninput="form['${id}']=this.value">${esc(val)}</textarea>`;
}
function yn(key,val=""){
  return `<div class="yn">${["Sí","No","N/A"].map(v=>`<button onclick="setYN('${key}','${v}',this)" class="${val===v?'sel-yn':''}">${v}</button>`).join("")}</div>`;
}
function mc(key, options, vals=[], color=""){
  return `<div class="mc ${color}">${options.map(o=>`<button onclick="toggleMC('${key}','${o}',this)" class="${vals.includes(o)?'sel-mc':''}">${o}</button>`).join("")}</div>`;
}
function sectCard(color,icon,title,content){
  return `<div class="card"><div class="sect-title" style="color:${color}">${icon} ${title}</div>${content}</div>`;
}
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function setYN(key,val,btn){
  form[key]=val;
  btn.closest(".yn").querySelectorAll("button").forEach(b=>b.classList.remove("sel-yn"));
  btn.classList.add("sel-yn");
  if(["aplicaTintas","aplicaPrueba","poros","errDim","errUbi"].includes(key)) rebuildConditionals();
}
function toggleMC(key,val,btn){
  if(!Array.isArray(form[key])) form[key]=[];
  const idx=form[key].indexOf(val);
  if(idx>=0) form[key].splice(idx,1); else form[key].push(val);
  btn.classList.toggle("sel-mc");
  if(key==="tipoLimp") rebuildConditionals();
}
function rebuildConditionals(){
  const fc = document.getElementById("form-content");
  const st = fc.scrollTop||0;
  buildForm();
  fc.scrollTop = st;
}

      ${fg("Etapa / Proceso",`<select onchange="photoEtapa=this.value"><option value="">-- Seleccionar --</option>${ETAPAS_FOTO.map(e=>`<option${photoEtapa===e?" selected":""}>${e}</option>`).join("")}</select>`)}
      ${fg("Descripción (opcional)",`<input id="photoDescInp" type="text" value="${esc(photoDesc)}" placeholder="Ej: Costura pared 2, inicio rechazo..." oninput="photoDesc=this.value">`)}
      <div style="margin-bottom:10px">
        <button onclick="togglePhotoRech(this)" style="padding:5px 12px;border-radius:4px;border:1px solid ${photoRech?'var(--red)':'var(--border)'};background:${photoRech?'rgba(239,68,68,.15)':'transparent'};color:${photoRech?'var(--red)':'var(--muted)'};font-size:12px;font-weight:700;cursor:pointer">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">

        <button onclick="triggerPhotoGallery()" style="padding:10px;background:transparent;border:1px solid var(--purple);color:var(--purple);border-radius:4px;font-weight:700;font-size:12px;cursor:pointer">🗂 Galería</button>
      </div>
      <input type="file" id="photoCam" accept="image/*" capture="environment" multiple style="display:none" onchange="handlePhotos(this)">

    </div>
    ${galleryHtml}
  `);
}

function triggerPhotoCapture(){ document.getElementById("photoCam").click(); }
function triggerPhotoGallery(){ document.getElementById("photoGal").click(); }
function togglePhotoRech(btn){
  photoRech=!photoRech;
  btn.style.borderColor=photoRech?"var(--red)":"var(--border)";
  btn.style.background=photoRech?"rgba(239,68,68,.15)":"transparent";
  btn.style.color=photoRech?"var(--red)":"var(--muted)";
}

function handlePhotos(input){
  const files=Array.from(input.files);
  let done=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      // Compress image
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement("canvas");
        const MAX=800;
        let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        const dataUrl=canvas.toDataURL("image/jpeg",0.7);
        form.imagenes.push({id:Date.now()+Math.random(),etapa:photoEtapa||"Inspección Inicial",dataUrl,descripcion:photoDesc,esRechazo:photoRech,fecha:new Date().toLocaleDateString("es-CO")});
        done++;
        if(done===files.length){ photoDesc=""; buildForm(); }
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  input.value="";
}

function delPhoto(id){
  form.imagenes=form.imagenes.filter(i=>String(i.id)!==String(id));
  buildForm();
}

function openPhotoOverlay(id){
  const img=form.imagenes.find(i=>String(i.id)===String(id));
  if(!img) return;
  document.getElementById("ovImg").src=img.dataUrl;
  document.getElementById("ovInfo").innerHTML=`<div style="font-weight:700;color:var(--accent)">${img.etapa}</div>${img.descripcion?`<div>${esc(img.descripcion)}</div>`:""}<div style="color:var(--muted);font-size:11px">${img.fecha}</div>${img.esRechazo?`<div style="color:var(--red);font-weight:700">⚠ RECHAZO</div>`:""}`;
  document.getElementById("photoOverlay").classList.add("show");
}
function closePhotoOverlay(){ document.getElementById("photoOverlay").classList.remove("show"); }

function saveRecord(){
  collectFormFromDOM();
  if(!form.tipo) return alert("Selecciona el tipo de equipo");
  if(!form.equipoId||!form.equipoId.trim()) return alert("Ingresa el ID del equipo");
  if(!form.estado) return alert("Selecciona el estado");
  const rec={...form,
    capas:form.capas.map(c=>({...c})),
    imagenes:(form.imagenes||[]).map(i=>({...i})),
    uid:Date.now(),
    fecha:new Date().toLocaleDateString("es-CO")
  };
  records.unshift(rec);
  save();
  form=newForm();
  buildForm();
  const msg=document.getElementById("savedMsg");
  msg.classList.add("show");

  records.forEach(r=>{ if(byType[r.tipo]!==undefined) byType[r.tipo]++; });
  document.getElementById("t-tank").textContent=byType.Tanque;
  document.getElementById("t-prensa").textContent=byType.Prensa;
  document.getElementById("t-rad").textContent=byType.Radiador;

  const today=new Date(); today.setHours(0,0,0,0);

  } else { vencBox.style.display="none"; }

  document.getElementById("vencBadge").textContent=venc.length;
  document.getElementById("vencBadge").style.display=venc.length>0?"":"none";

  const alerts=records.filter(r=>r.estado==="RECHAZADO"||r.estado==="PENDIENTE");
  document.getElementById("dash-alerts").innerHTML=alerts.length===0
    ?`<div class="empty-state">✅ Sin alertas</div>`

      dr("P. diseño",r.presDiseno?r.presDiseno+" psi":"")+dr("P. prueba",r.presPrueba?r.presPrueba+" psi":"")+
      dr("Duración",r.duracion?r.duracion+" min":"")+dr("Manómetro ID",r.manometroId)+dr("Calibración",r.calibManom)+
      dr("Resultado",r.resultPrueba)+dr("Fugas",r.fugas)+dr("Ubicación fugas",r.ubicFugas)+dr("Corrección",r.corrFugas)
    ):""}
    ${r.gradoLimp||r.espTotalMed?ds("Pintura","var(--teal)","🎨",
      dr("Limpieza",r.tipoLimp)+dr("Grado",r.gradoLimp)+dr("Perfil anclaje",r.perfilAnclaje)+
      dr("Esp. total medido",r.espTotalMed?r.espTotalMed+" mils":"")+dr("Conforme",r.espTotalConf)
    ):""}
    ${r.obs?ds("Observaciones","var(--accent)","📝",`<div style="font-size:13px">${esc(r.obs)}</div>`):""}
    ${allImgs.length>0?ds("Fotografías","var(--purple)","📷",photoHtml):""}
    <button class="btn-del-rec" onclick="deleteRecord(${r.uid})">ELIMINAR REGISTRO</button>
    <div style="height:20px"></div>
  `;

  document.getElementById("detail").classList.add("show");
  document.getElementById("detail").scrollTop=0;
}

function showDetailPhoto(id){
  const img=detailRecord&&(detailRecord.imagenes||[]).find(i=>String(i.id)===String(id));
  if(!img) return;
  document.getElementById("ovImg").src=img.dataUrl;
  document.getElementById("ovInfo").innerHTML=`<div style="font-weight:700;color:var(--accent)">${img.etapa}</div>${img.descripcion?`<div>${esc(img.descripcion)}</div>`:""}<div style="color:var(--muted);font-size:11px">${img.fecha||""}</div>${img.esRechazo?`<div style="color:var(--red);font-weight:700">⚠ RECHAZO</div>`:""}`;
  document.getElementById("photoOverlay").classList.add("show");
}

function closeDetail(){
  document.getElementById("detail").classList.remove("show");
  detailRecord=null;
}

function deleteRecord(uid){
  if(!confirm("¿Eliminar este registro?")) return;
  records=records.filter(r=>r.uid!==uid);
  save();
  closeDetail();
  renderDash();
  renderRecords();
}

// ══════════════════════════════════════════════
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").then(()=>console.log("SW registered")).catch(e=>console.log("SW error",e));
  });
}

// INIT
renderDash();
</script>
